name: flutter_landing_page
description: Responsive landing page for Meridian Advisory Group, a strategy
  and management consulting firm. Home, About Us, Services and Contact sections.
publish_to: 'none'
version: 1.4.1
environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  auto_size_text: ^3.0.0
  card_swiper: ^3.0.1
  dart_fusion:
    git:
      url: https://github.com/Nialixus/dart_fusion.git
      ref: v2.9.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.2.0+1
  go_router: ^13.0.1
  http: ^1.1.0
  meta_seo: ^3.0.7
  scroll_to_id: ^1.5.1
  seo: ^0.0.5
  url_launcher: ^6.2.1
  url_strategy: ^0.2.0

dev_dependencies:
  flutter_lints: ^3.0.1
  flutter_test:
    sdk: flutter
  package_rename: ^1.5.1

flutter:
  uses-material-design: true
